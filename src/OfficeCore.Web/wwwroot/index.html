<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>OfficeCore</title>
    <base href="/" />
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('officecore_theme') || 'dark';
                if (theme === 'light') {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        html.dark { color-scheme: dark; }
        .dark input[type="date"]::-webkit-calendar-picker-indicator,
        .dark input[type="time"]::-webkit-calendar-picker-indicator,
        .dark input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(100%) saturate(0%) hue-rotate(288deg) brightness(1000%) contrast(1000%);
        }
    </style>
    <link rel="stylesheet" href="app.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-fuchsia-600 selection:text-white">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center bg-zinc-950">
            <div class="flex flex-col items-center gap-5">
                <div class="relative flex items-center justify-center">
                    <div class="absolute -inset-2 rounded-2xl bg-gradient-to-r from-fuchsia-600 to-violet-600 opacity-40 blur-lg animate-pulse"></div>
                    <div class="relative size-14 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-white font-bold text-xl shadow-2xl">
                        <span class="bg-gradient-to-br from-fuchsia-400 to-violet-400 bg-clip-text text-transparent">OC</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 text-zinc-400 text-xs font-medium tracking-wide">
                    <svg class="animate-spin size-3.5 text-fuchsia-500" viewBox="0 0 24 24" fill="none">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <span>Initializing workspace...</span>
                </div>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui" class="hidden absolute bottom-4 left-4 right-4 z-50 bg-red-950/90 border border-red-800 text-red-200 px-6 py-4 rounded-xl shadow-2xl backdrop-blur-sm flex items-center justify-between">
        An unhandled error has occurred.
        <a href="" class="text-white hover:underline font-medium reload">Reload</a>
        <a class="dismiss font-bold cursor-pointer hover:text-white px-2">&times;</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="js/cropperInterop.js"></script>
    <script src="js/themeInterop.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/mapInterop.js?v=6"></script>
    <script src="js/fileInterop.js"></script>
    <script>
        function resizeChatTextarea(el) {
            if (!el) return;
            el.style.height = '38px';
            var scrollH = el.scrollHeight;
            if (scrollH <= 38) {
                el.style.height = '38px';
                el.style.overflowY = 'hidden';
            } else if (scrollH <= 82) {
                el.style.height = scrollH + 'px';
                el.style.overflowY = 'hidden';
            } else {
                el.style.height = '82px';
                el.style.overflowY = 'auto';
            }
        }

        window.resizeChatTextareaById = function(id) {
            var el = document.getElementById(id);
            if (el) resizeChatTextarea(el);
        };

        document.addEventListener('input', function(e) {
            if (e.target && e.target.id === 'chat-input-textarea') {
                resizeChatTextarea(e.target);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target && e.target.id === 'chat-input-textarea' && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
            }
        });

        window.resetChatTextarea = function() {
            var el = document.getElementById('chat-input-textarea');
            if (el) {
                el.style.height = '38px';
                el.style.overflowY = 'hidden';
            }
        };

    </script>
    <script src="js/chatPopover.js?v=1"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
